name: fuzz-deep

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: discover
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(grep -rE '^func Fuzz[A-Za-z0-9_]+\(' --include='*_test.go' . \
            | awk -F: '
                {
                  sub(/^\.\//, "", $1)
                  n = split($1, parts, "/")
                  dir = parts[1]
                  for (i = 2; i < n; i++) dir = dir "/" parts[i]
                  match($2, /Fuzz[A-Za-z0-9_]+/)
                  fn = substr($2, RSTART, RLENGTH)
                  printf "{\"pkg\":\"./%s\",\"func\":\"%s\"}\n", dir, fn
                }' \
            | jq -sc '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz-deep:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: fuzz-deep (${{ matrix.func }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache: true
      - env:
          FUNC: ${{ matrix.func }}
          PKG: ${{ matrix.pkg }}
        run: go test -run=^$ -fuzz="$FUNC" -fuzztime=5m "$PKG"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers-${{ matrix.func }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.func }}
          if-no-files-found: ignore
          retention-days: 30
