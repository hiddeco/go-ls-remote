name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Windows runners default to pwsh which mangles `-flag=value` style
    # arguments (the `=` triggers PowerShell parameter parsing and
    # `-coverprofile=cover.out` ends up split into separate tokens).
    # Force Git Bash everywhere so command-line parsing matches Linux
    # and macOS.
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ['1.25', '1.26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go build ./...
      - run: go test -race -shuffle=on -count=1 -coverprofile=cover.out -covermode=atomic ./...
      - run: go test -tags=live -run=^$ ./internal/livetest/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: cover.out
          if-no-files-found: error
          retention-days: 7

  test-386:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOARCH: '386'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...
      - run: go test -shuffle=on -count=1 ./...

  coverage-report:
    needs: [test, test-386]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: cover-in
          merge-multiple: false
      - name: Merge coverage profiles
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find cover-in -name 'cover.out' -print0)
          go run github.com/wadey/gocovmerge@b5bfa59ec0adc420475f97f89b58045c721d761c "${files[@]}" > merged.out
      - name: Render summary
        run: |
          {
            echo '## Coverage summary'
            echo ''
            echo '```'
            go tool cover -func=merged.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render HTML
        run: go tool cover -html=merged.out -o coverage.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage.html
          retention-days: 14
